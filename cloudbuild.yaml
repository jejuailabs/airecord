# Cloud Build — Realtime Worker 이미지 빌드 (apps/worker/Dockerfile).
# 루트가 빌드 컨텍스트다 (Dockerfile의 COPY가 루트 기준: packages/·apps/worker/).
# 사용: gcloud builds submit --config cloudbuild.yaml --substitutions=_IMAGE=<이미지태그>
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-f', 'apps/worker/Dockerfile', '-t', '${_IMAGE}', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_IMAGE}']
images:
  - '${_IMAGE}'
options:
  logging: CLOUD_LOGGING_ONLY
